services:
  okx-trader:
    build: .
    container_name: okx-trader
    env_file:
      - .env
    environment:
      - TZ=UTC
    volumes:
      - ./out:/app/out
      - ./live/config.json:/app/live/config.json:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
